<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#13161f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sách">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Sách - PDF Reader</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Thư viện sách</h1>
    <div class="count" id="bookCount"></div>
    <button class="icon-btn accent" id="btnAdd" title="Thêm sách PDF" aria-label="Thêm sách PDF">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>

  <main id="shelf" class="shelf"></main>

  <div id="progress" class="progress" hidden>
    <div class="progress-head">
      <span id="progressLabel">Đang xử lý…</span>
      <span id="progressPct"></span>
    </div>
    <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
  </div>

  <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden>

  <div class="toast" id="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
    try {
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(() => {});
    } catch (_) {}
  </script>
</body>
</html>
