<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#13161f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Đọc sách</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="reader-body">
  <div class="toolbar" id="toolbar">
    <button class="icon-btn" id="btnBack" aria-label="Quay lại">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="toolbar-title">
      <span id="bookTitle"></span>
      <span class="toolbar-sub" id="pageInfo"></span>
    </div>
    <button class="icon-btn" id="btnSettings" aria-label="Cài đặt đọc">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.08a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.08a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1.03z"/>
      </svg>
    </button>
  </div>

  <main id="reader" class="reader-main">
    <div class="loading">
      <div class="spinner"></div>
      <p id="loadText">Đang mở sách…</p>
    </div>
  </main>

  <div class="toc-sheet" id="tocSheet" hidden>
    <div class="sheet-head">
      <b>Mục lục</b>
      <button class="icon-btn" id="btnCloseToc" aria-label="Đóng">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <ul class="toc-list" id="tocList"></ul>
  </div>

  <div class="settings-sheet" id="settingsSheet" hidden>
    <div class="sheet-head">
      <b>Chế độ đọc</b>
      <button class="icon-btn" id="btnCloseSettings" aria-label="Đóng">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="setting-row">
      <span>Cỡ chữ</span>
      <div class="seg">
        <button id="fontMinus" aria-label="Giảm cỡ chữ">A−</button>
        <span id="fontSizeLabel"></span>
        <button id="fontPlus" aria-label="Tăng cỡ chữ">A+</button>
      </div>
    </div>
    <div class="setting-row">
      <span>Kiểu chữ</span>
      <div class="seg" id="fontFamilySeg">
        <button data-font="serif">Serif</button>
        <button data-font="sans">Sans</button>
      </div>
    </div>
    <div class="setting-row">
      <span>Nền</span>
      <div class="theme-row" id="themeRow">
        <button class="theme-dot light" data-theme="light" aria-label="Nền sáng"></button>
        <button class="theme-dot paper" data-theme="paper" aria-label="Nền giấy vàng"></button>
        <button class="theme-dot dark" data-theme="dark" aria-label="Nền tối"></button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
  <script type="module" src="js/reader.js"></script>
</body>
</html>
